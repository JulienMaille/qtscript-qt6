name: Release

on:
  push:
    branches: [quickjs-modernize]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag/ref to aggregate (leave empty to use the selected ref)
        required: false

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the four build runs, download, and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_INPUT_TAG" ]]; then
            target_ref="$RELEASE_INPUT_TAG"
            tag_name="$RELEASE_INPUT_TAG"
            prerelease=false
          elif [[ "$RELEASE_REF_TYPE" == "tag" ]]; then
            target_ref="$RELEASE_REF_NAME"
            tag_name="$RELEASE_REF_NAME"
            prerelease=false
          elif [[ "$RELEASE_REF_NAME" == "quickjs-modernize" ]]; then
            target_ref="$RELEASE_SHA"
            tag_name="quickjs-modernize-${RELEASE_SHA:0:12}"
            prerelease=true
          else
            echo "::error::A tag/ref input or a supported branch ref is required." >&2
            exit 1
          fi

          echo "Aggregating artifacts for $target_ref into release $tag_name"
          WFS=(windows-lts windows-latest linux-lts linux-latest)
          declare -A RUN_IDS
          target_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/$target_ref" --jq .sha 2>/dev/null || true)
          if [[ -z "$target_sha" ]]; then
            echo "::error::Ref $target_ref does not resolve to a commit." >&2
            exit 1
          fi
          echo "Ref $target_ref resolves to $target_sha"
          deadline=$(( SECONDS + 2400 ))   # 40 min total
          appear_deadline=$(( SECONDS + 120 ))  # 2 min for runs to appear

          # Phase 1: all 4 runs must exist
          while :; do
            missing=0
            for wf in "${WFS[@]}"; do
              [[ -n "${RUN_IDS[$wf]:-}" ]] && continue
              row=$(gh run list --workflow "$wf.yml" --commit "$target_sha" --limit 1 --json status,conclusion,databaseId,headSha --jq '.[0] // empty' 2>/dev/null || true)
              if [[ -z "$row" ]]; then
                missing=1
              elif [[ "$(printf '%s' "$row" | jq -r .headSha)" != "$target_sha" ]]; then
                echo "::error::Run for $wf has an unexpected head SHA." >&2
                exit 1
              else
                RUN_IDS[$wf]=$(printf '%s' "$row" | jq -r .databaseId)
              fi
            done
            [[ $missing -eq 0 ]] && break
            if (( SECONDS > appear_deadline )); then
              echo "::error::No build run found for one of the workflows at $target_ref. Re-push the ref (or run the build workflows manually) so the four builds run, then re-run this job." >&2
              exit 1
            fi
            sleep 15
          done

          # Phase 2: stable tags require every matrix job; the experimental
          # QuickJS branch publishes only when each Release job and its smoke
          # build succeeded. Its Debug job still runs and reports the complete
          # inherited suite, but known legacy-test gaps must not hide usable
          # Release artifacts.
          while :; do
            if (( SECONDS > deadline )); then
              echo "::error::Timed out after 40 minutes waiting for the four build runs." >&2
              exit 1
            fi
            done_count=0
            for wf in "${WFS[@]}"; do
              run_id="${RUN_IDS[$wf]}"
              status=$(gh run view "$run_id" --json status --jq .status)
              if [[ "$prerelease" == true ]]; then
                release_conclusion=$(gh run view "$run_id" --json jobs --jq '[.jobs[] | select(.name | endswith(" (Release)")) | .conclusion] | .[0] // "null"')
                if [[ "$status" == completed && "$release_conclusion" == success ]]; then
                  done_count=$((done_count+1))
                elif [[ "$status" == completed ]]; then
                  echo "::error::Release job in run $run_id ($wf) finished with '$release_conclusion'; aborting prerelease creation." >&2
                  exit 1
                fi
              else
                conclusion=$(gh run view "$run_id" --json conclusion --jq '.conclusion // "null"')
                if [[ "$status" == completed && "$conclusion" == success ]]; then
                  done_count=$((done_count+1))
                elif [[ "$status" == completed ]]; then
                  echo "::error::Run $run_id ($wf) finished with '$conclusion'; aborting release creation." >&2
                  exit 1
                fi
              fi
            done
            [[ $done_count -eq 4 ]] && break
            sleep 20
          done

          # Phase 3: download, zip, release
          rm -rf .artifacts dist
          mkdir -p dist
          for wf in "${WFS[@]}"; do
            gh run download "${RUN_IDS[$wf]}" --dir ".artifacts/$wf"
            dir=$(find ".artifacts/$wf" -mindepth 1 -maxdepth 1 -type d | head -n 1)
            [[ -z "$dir" ]] && { echo "::error::No artifact dir downloaded for $wf" >&2; exit 1; }
            name=$(basename "$dir")
            (cd "$dir" && zip -qr "$OLDPWD/dist/$name.zip" .)
            echo "packed dist/$name.zip"
          done

          if gh release view "$tag_name" >/dev/null 2>&1; then
            echo "Release $tag_name already exists; nothing to do."
            exit 0
          fi
          if [[ "$prerelease" == true ]]; then
            gh release create "$tag_name" dist/*.zip --target "$target_sha" --generate-notes --prerelease
          else
            gh release create "$tag_name" dist/*.zip --target "$target_sha" --generate-notes
          fi
