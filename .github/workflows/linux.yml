name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Qt 6.9.2 GCC 64-bit (Release)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out patch repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Qt 6.9.2
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.9.2'
          host: linux
          target: desktop
          cache: true

      - name: Clone KDE QtScript, apply patches, build, and test
        shell: bash
        run: >-
          ./scripts/build-linux.sh
          --qt-root "$QT_ROOT_DIR"
          --configuration Release
          --parallel 4

      - name: Upload QtScript install
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qtscript-qt6-linux-gcc-Release
          path: .work/linux/Release/install
          if-no-files-found: error
          retention-days: 14
